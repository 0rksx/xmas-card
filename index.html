<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merry Christmas - KURAMAE CANNELÉ</title>
  <style>
    :root {
      --bg-color: #f6f2ec;
      --burgundy: #620c17;
      --gold-light: #f7ede2;
      --gold-accent: #c5a059;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Apple SD Gothic Neo", "メイリオ", sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 95%;
      max-width: 860px;
      padding: 16px;
      box-sizing: border-box;
    }

    .envelope-container {
      position: relative;
      width: 100%;
      height: 480px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.22);
      background-color: #3b060d;
    }

    .bg-closed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('envelope_close.jpg') no-repeat center center;
      background-size: cover;
      z-index: 5;
      transition: opacity 0.8s ease-in-out;
    }

    .bg-opened {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('envelope_open.png') no-repeat center center;
      background-size: cover;
      z-index: 1;
    }

    .letter {
      position: absolute;
      top: 25px;
      left: 5%;
      width: 90%;
      height: 430px;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 28px 32px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transform: translateY(320px);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }

    .envelope-container.open .bg-closed {
      opacity: 0;
      pointer-events: none;
    }
    .envelope-container.open .letter {
      transform: translateY(0);
    }

    /* 봉인 애니메이션: 편지가 봉투 안으로 쏙 들어가고 닫힌 봉투가 덮임 */
    .envelope-container.sealed .letter {
      transform: translateY(340px) !important;
      transition: transform 1s ease-in-out !important;
    }
    .envelope-container.sealed .bg-closed {
      opacity: 1 !important;
      transition: opacity 0.8s ease-in-out 0.5s !important;
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
    }
    .form-col {
      flex: 1;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .to-label {
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      color: var(--burgundy);
      display: inline-block;
      margin-right: 8px;
    }
    input.input-to {
      border: none;
      border-bottom: 2px solid #ddd;
      background: transparent;
      font-size: 16px;
      padding: 4px;
      width: 80%;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", sans-serif;
    }
    input.input-to:focus {
      border-bottom-color: var(--burgundy);
    }
    textarea.input-msg {
      width: 100%;
      height: 120px;
      border: 1px solid #e0d8cc;
      background-color: #faf7f2;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 13.5px;
      line-height: 1.6;
      resize: none;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    textarea.input-msg:focus {
      border-color: var(--burgundy);
      background-color: #fff;
    }
    .char-count {
      text-align: right;
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      margin-bottom: 4px;
    }
    input.input-pin {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    select.select-gift {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    button.btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--burgundy);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(98, 12, 23, 0.3);
    }

    /* 프리뷰 모달 팝업 */
    .preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .preview-modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .preview-content {
      background: #fff;
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }
    .preview-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--burgundy);
      margin-bottom: 16px;
    }
    .preview-card {
      background: #faf7f2;
      border: 1px solid #e0d8cc;
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .preview-btn-group {
      display: flex;
      gap: 10px;
    }
    .btn-edit {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-confirm {
      flex: 1;
      padding: 12px;
      border: none;
      background: var(--burgundy);
      color: #fff;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 완료 화면 */
    .result-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #4a0810, #220205);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
      z-index: 10;
    }
    .result-screen.show {
      opacity: 1;
      pointer-events: auto;
    }
    .result-screen .date-notice {
      font-size: 15px;
      color: #e2d4c0;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .result-screen h1.main-title {
      font-family: "Didot", "Bodoni MT", Georgia, serif;
      font-size: 34px;
      letter-spacing: 4px;
      color: var(--gold-light);
      margin: 0 0 10px 0;
    }
    .result-screen p.sub-title {
      font-family: Georgia, serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--gold-accent);
      margin: 0 0 35px 0;
      font-style: italic;
    }
    .btn-share {
      background-color: #06c755;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="envelope-container" id="envelopeContainer">
    
    <div class="bg-closed"></div>
    <div class="bg-opened"></div>

    <div class="letter">
      <div class="form-row">
        <div class="form-col">
          <div class="form-group">
            <span class="to-label">To.</span>
            <input type="text" id="toName" class="input-to" placeholder="お名前">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <textarea id="message" class="input-msg" maxlength="100" placeholder="12月24日に開くメッセージを入力してください。(100文字以内)" oninput="updateCharCount(this)"></textarea>
            <div class="char-count"><span id="currentCount">0</span> / 100文字</div>
          </div>
        </div>

        <div class="form-col" style="display: flex; flex-direction: column; justify-content: space-between;">
          <div class="form-group">
            <input type="password" id="pin" class="input-pin" maxlength="4" inputmode="numeric" placeholder="暗証番号 (4桁の数字)">
          </div>
          <div class="form-group">
            <select id="giftOption" class="select-gift">
              <option value="free">無料（メッセージのみ贈る）</option>
              <option value="cannele">カヌレ1個 ギフトカード (500円)</option>
              <option value="set">カヌレ＆紅茶セット チケット (1,000円)</option>
            </select>
          </div>
          <button class="btn-submit" onclick="openPreview()">メッセージカードを封印して贈る</button>
        </div>
      </div>
    </div>

    <!-- 미리보기 팝업 모달 -->
    <div class="preview-modal" id="previewModal">
      <div class="preview-content">
        <div class="preview-title">内容の確認 (最終プレビュー)</div>
        <div class="preview-card">
          <p style="margin: 0 0 8px 0;"><strong>To.</strong> <span id="prevTo"></span></p>
          <p style="margin: 0 0 12px 0; white-space: pre-wrap; color: #444;" id="prevMsg"></p>
          <p style="margin: 0; font-size: 11px; color: #888;">ギフト: <span id="prevGift"></span></p>
        </div>
        <div class="preview-btn-group">
          <button class="btn-edit" onclick="closePreview()">修正する</button>
          <button class="btn-confirm" onclick="confirmAndSubmit()">この内容で贈る</button>
        </div>
      </div>
    </div>

    <div class="result-screen" id="resultScreen">
      <div class="date-notice">12月24日にメッセージが届きます</div>
      <h1 class="main-title">MERRY CHRISTMAS</h1>
      <p class="sub-title">with KURAMAE CANNELÉ</p>
      <button class="btn-share" onclick="alert('LINE共有リンクがコピーされました！')">LINEで相手に贈る</button>
    </div>

  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'success') {
      const container = document.getElementById('envelopeContainer');
      container.classList.add('open');
      document.getElementById('resultScreen').classList.add('show');
      return;
    }

    setTimeout(() => {
      document.getElementById('envelopeContainer').classList.add('open');
    }, 2000);
  });

  function updateCharCount(textarea) {
    document.getElementById('currentCount').innerText = textarea.value.length;
  }

  // 프리뷰 팝업 열기
  function openPreview() {
    const toName = document.getElementById('toName').value;
    const msg = document.getElementById('message').value;
    const pin = document.getElementById('pin').value;
    const giftSelect = document.getElementById('giftOption');
    const giftText = giftSelect.options[giftSelect.selectedIndex].text;

    if (!msg) {
      alert('メッセージを入力してください。');
      return;
    }
    if (!pin || pin.length < 4) {
      alert('暗証番号4桁を入力してください。');
      return;
    }

    document.getElementById('prevTo').innerText = toName || 'お名前なし';
    document.getElementById('prevMsg').innerText = msg;
    document.getElementById('prevGift').innerText = giftText;

    document.getElementById('previewModal').classList.add('show');
  }

  function closePreview() {
    document.getElementById('previewModal').classList.remove('show');
  }

  // 최종 확인 후 봉인 애니메이션 및 결제 진행
  function confirmAndSubmit() {
    closePreview();
    const gift = document.getElementById('giftOption').value;

    const container = document.getElementById('envelopeContainer');
    container.classList.remove('open');
    container.classList.add('sealed');

    setTimeout(() => {
      if (gift === 'cannele') {
        window.location.href = 'https://square.link/u/4U1MkTXp';
        return;
      } else if (gift === 'set') {
        alert('1,000円の決済リンクは準備中です。500円ギフトをお試しください。');
        return;
      }
      document.getElementById('resultScreen').classList.add('show');
    }, 1600);
  }
</script>
</body>
</html>
