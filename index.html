<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merry Christmas - KURAMAE CANNELÉ</title>
  <style>
    :root {
      --bg-color: #f6f2ec;
      --burgundy: #620c17;
      --gold-light: #f7ede2;
      --gold-accent: #c5a059;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
      background: url('tree_bg.jpg') repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 95%;
      max-width: 860px;
      padding: 16px;
      box-sizing: border-box;
    }

    .envelope-container {
      position: relative;
      width: 100%;
      height: 480px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.5);
      background: url('paper_red.jpg') repeat center center;
      background-size: cover;
    }

    .bg-closed {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('envelope_close.jpg') no-repeat center center;
      background-size: cover;
      z-index: 5;
      transition: opacity 0.8s ease-in-out;
    }

    .bg-final {
      position: absolute;
      top: -100%; left: 0; width: 100%; height: 100%;
      background: url('envelope_final.jpg') no-repeat center center;
      background-size: cover;
      z-index: 5;
      transition: top 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bg-opened {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('envelope_open.png') no-repeat center center;
      background-size: cover;
      z-index: 1;
    }

    .letter {
      position: absolute;
      top: 25px; left: 5%; width: 90%; height: 430px;
      background: url('paper_ivory.jpg') repeat center center;
      background-size: cover;
      border-radius: 0;
      padding: 24px 32px 12px 32px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transform: translateY(320px);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .envelope-container.open .bg-closed { opacity: 0; pointer-events: none; }
    .envelope-container.open .letter { transform: translateY(0); }
    .envelope-container.sealed .letter { transform: translateY(340px) !important; transition: transform 1s ease-in-out !important; }
    .envelope-container.sealed .bg-final { top: 0 !important; }

    .form-row { display: flex; gap: 24px; }
    .form-col { flex: 1; display: flex; flex-direction: column; }
    .form-group { margin-bottom: 10px; }
    
    .to-label {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 22px;
      font-weight: bold;
      color: var(--burgundy);
      margin-right: 6px;
    }
    
    input.input-to, input.input-from {
      border: none;
      border-bottom: 1px solid #aaa;
      background: transparent;
      font-size: 15px;
      padding: 4px;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
    }
    input.input-to { width: 75%; }
    input.input-from { width: 70%; }
    
    textarea.input-msg {
      width: 100%;
      height: 210px;
      border: 1px solid #d4ceb8;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 13.5px;
      line-height: 1.6;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .char-count { text-align: right; font-size: 11px; color: #777; margin-top: 3px; }
    
    .right-col-inner {
      margin-top: 40px;
    }

    input.input-pin {
      width: 100%;
      padding: 11px;
      border: 1px solid #d4ceb8;
      background-color: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 12px;
    }
    
    select.select-gift {
      width: 100%;
      padding: 11px;
      border: 1px solid #d4ceb8;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 16px;
    }
    
    button.btn-submit {
      width: 100%;
      padding: 10px 4px;
      background: transparent;
      color: #222222;
      border: none;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: none;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    button.btn-submit:hover {
      color: #000;
      font-weight: 500;
    }

    .brand-logo-bottom {
      max-width: 60px;
      height: auto;
      margin: 0 auto 4px auto;
      display: block;
    }

    /* 프리뷰 팝업 */
    .preview-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .preview-modal.show { opacity: 1; pointer-events: auto; }
    .preview-content { background: #fff; width: 90%; max-width: 400px; border-radius: 16px; padding: 24px; text-align: center; }
    .preview-card { background: #faf7f2; border: 1px solid #e0d8cc; border-radius: 8px; padding: 16px; text-align: left; margin-bottom: 20px; font-size: 13px; }
    .preview-btn-group { display: flex; gap: 10px; }
    .
