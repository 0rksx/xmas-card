<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merry Christmas - KURAMAE CANNELÉ</title>
  <style>
    :root {
      --bg-color: #f6f2ec;
      --burgundy: #620c17;
      --gold-light: #f7ede2;
      --gold-accent: #c5a059;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 440px;
      padding: 12px;
      box-sizing: border-box;
    }

    /* 카드 전체 프레임 비율 조정 */
    .envelope-container {
      position: relative;
      width: 100%;
      height: 620px;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.2);
      background-color: #3b060d;
    }

    /* 1. 닫힌 원본 이미지 (MERRY CHRISTMAS 문구 안 잘리게 contain/fit 처리) */
    .bg-closed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('envelope_close.jpg') no-repeat center center;
      background-size: contain;
      background-color: #620c17;
      z-index: 5;
      transition: opacity 0.8s ease-in-out;
    }

    /* 2. 열린 원본 이미지 배경 */
    .bg-opened {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('envelope_open.png') no-repeat center center;
      background-size: contain;
      background-color: #620c17;
      z-index: 1;
    }

    /* 3. 편지지 (봉투 안에서 전체가 밖으로 완전히 끌어올려지도록 좌표 수정) */
    .letter {
      position: absolute;
      top: 30px;
      left: 5%;
      width: 90%;
      height: 550px;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 24px 20px;
      box-sizing: border-box;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      transform: translateY(420px);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }

    /* 2초 후 동작 애니메이션: 편지지가 봉투 밖으로 쑥 올라옴 */
    .envelope-container.open .bg-closed {
      opacity: 0;
      pointer-events: none;
    }
    .envelope-container.open .letter {
      transform: translateY(0);
    }

    /* 봉인 시 역동작 */
    .envelope-container.sealed .letter {
      transform: translateY(420px) !important;
      transition: transform 1s ease-in-out !important;
    }
    .envelope-container.sealed .bg-closed {
      opacity: 1 !important;
      transition: opacity 0.8s ease-in-out 0.6s !important;
    }

    /* 입력 폼 스타일링 */
    .form-group {
      margin-bottom: 14px;
    }
    .to-label {
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: bold;
      color: var(--burgundy);
      display: inline-block;
      margin-right: 6px;
    }
    input.input-to {
      border: none;
      border-bottom: 2px solid #ddd;
      background: transparent;
      font-size: 15px;
      padding: 4px;
      width: 75%;
      outline: none;
    }
    input.input-to:focus {
      border-bottom-color: var(--burgundy);
    }
    textarea.input-msg {
      width: 100%;
      height: 140px;
      border: 1px solid #e0d8cc;
      background-color: #faf7f2;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    textarea.input-msg:focus {
      border-color: var(--burgundy);
      background-color: #fff;
    }
    .char-count {
      text-align: right;
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    input.input-pin {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    select.select-gift {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    button.btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--burgundy);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(98, 12, 23, 0.3);
    }

    /* 최종 완료 화면 */
    .result-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #4a0810, #220205);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
      z-index: 10;
    }
    .result-screen.show {
      opacity: 1;
      pointer-events: auto;
    }
    .result-screen .date-notice {
      font-size: 14px;
      color: #e2d4c0;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .result-screen h1.main-title {
      font-family: "Didot", "Bodoni MT", Georgia, serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--gold-light);
      margin: 0 0 8px 0;
    }
    .result-screen p.sub-title {
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--gold-accent);
      margin: 0 0 35px 0;
      font-style: italic;
    }
    .btn-share {
      background-color: #06c755;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="envelope-container" id="envelopeContainer">
    
    <div class="bg-closed"></div>
    <div class="bg-opened"></div>

    <div class="letter">
      <div class="form-group">
        <span class="to-label">To.</span>
        <input type="text" id="toName" class="input-to" placeholder="お名前">
      </div>

      <div class="form-group" style="margin-bottom: 0;">
        <textarea id="message" class="input-msg" maxlength="50" placeholder="12月24日に開くメッセージを入力してください。(50文字以内)" oninput="updateCharCount(this)"></textarea>
        <div class="char-count"><span id="currentCount">0</span> / 50文字</div>
      </div>

      <div class="form-group">
        <input type="password" id="pin" class="input-pin" maxlength="4" inputmode="numeric" placeholder="暗証番号 (4桁の数字)">
      </div>

      <div class="form-group">
        <select id="giftOption" class="select-gift">
          <option value="free">無料（メッセージのみ贈る）</option>
          <option value="cannele">カヌレ1個 ギフトカード (500円)</option>
          <option value="set">カヌレ＆紅茶セット チケット (1,000円)</option>
        </select>
      </div>

      <button class="btn-submit" onclick="submitLetter()">メッセージカードを封印して贈る</button>
    </div>

    <div class="result-screen" id="resultScreen">
      <div class="date-notice">12月24日にメッセージが届きます</div>
      <h1 class="main-title">MERRY CHRISTMAS</h1>
      <p class="sub-title">with KURAMAE CANNELÉ</p>
      <button class="btn-share" onclick="alert('LINE共有リンクがコピーされました！')">LINEで相手に贈る</button>
    </div>

  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      document.getElementById('envelopeContainer').classList.add('open');
    }, 2000);
  });

  function updateCharCount(textarea) {
    document.getElementById('currentCount').innerText = textarea.value.length;
  }

  function submitLetter() {
    const msg = document.getElementById('message').value;
    const pin = document.getElementById('pin').value;
    const gift = document.getElementById('giftOption').value;

    if (!msg) {
      alert('メッセージを入力してください。');
      return;
    }
    if (!pin || pin.length < 4) {
      alert('暗証番号4桁を入力してください。');
      return;
    }

    if (gift === 'cannele') {
      alert('Square 500円 決済ページへ移動します。');
      return;
    } else if (gift === 'set') {
      alert('Square 1,000円 決済ページへ移動します。');
      return;
    }

    const container = document.getElementById('envelopeContainer');
    container.classList.remove('open');
    container.classList.add('sealed');

    setTimeout(() => {
      document.getElementById('resultScreen').classList.add('show');
    }, 1600);
  }
</script>
</body>
</html>
