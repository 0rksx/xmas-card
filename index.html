<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merry Christmas - KURAMAE CANNELÉ</title>
  <style>
    :root {
      --bg-color: #f6f2ec;
      --burgundy: #620c17;
      --gold-light: #f7ede2;
      --gold-accent: #c5a059;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 95%;
      max-width: 860px;
      padding: 16px;
      box-sizing: border-box;
    }

    .envelope-container {
      position: relative;
      width: 100%;
      height: 480px;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.22);
      background-color: #3b060d;
    }

    .bg-closed {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('envelope_close.jpg') no-repeat center center;
      background-size: cover;
      z-index: 5;
      transition: opacity 0.8s ease-in-out;
    }

    .bg-final {
      position: absolute;
      top: -100%; left: 0; width: 100%; height: 100%;
      background: url('envelope_final.jpg') no-repeat center center;
      background-size: cover;
      z-index: 5;
      transition: top 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bg-opened {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('envelope_open.png') no-repeat center center;
      background-size: cover;
      z-index: 1;
    }

    .letter {
      position: absolute;
      top: 25px; left: 5%; width: 90%; height: 430px;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 24px 32px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transform: translateY(320px);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }

    .envelope-container.open .bg-closed { opacity: 0; pointer-events: none; }
    .envelope-container.open .letter { transform: translateY(0); }
    .envelope-container.sealed .letter { transform: translateY(340px) !important; transition: transform 1s ease-in-out !important; }
    .envelope-container.sealed .bg-final { top: 0 !important; }

    .form-row { display: flex; gap: 20px; margin-bottom: 8px; }
    .form-col { flex: 1; }
    .form-group { margin-bottom: 10px; }
    .to-label { font-size: 20px; font-weight: bold; color: var(--burgundy); margin-right: 6px; }
    input.input-to, input.input-from { border: none; border-bottom: 2px solid #ddd; background: transparent; font-size: 15px; padding: 4px; outline: none; font-family: inherit; }
    input.input-to { width: 75%; }
    input.input-from { width: 70%; }
    textarea.input-msg { width: 100%; height: 110px; border: 1px solid #e0d8cc; background-color: #faf7f2; border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 13.5px; line-height: 1.6; resize: none; outline: none; font-family: inherit; }
    .char-count { text-align: right; font-size: 11px; color: #888; margin-top: 2px; }
    input.input-pin { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; }
    select.select-gift { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; margin-bottom: 8px; background: #fff; }
    button.btn-submit { width: 100%; padding: 13px; background-color: var(--burgundy); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(98, 12, 23, 0.3); }

    /* 프리뷰 팝업 */
    .preview-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .preview-modal.show { opacity: 1; pointer-events: auto; }
    .preview-content { background: #fff; width: 90%; max-width: 400px; border-radius: 16px; padding: 24px; text-align: center; }
    .preview-card { background: #faf7f2; border: 1px solid #e0d8cc; border-radius: 8px; padding: 16px; text-align: left; margin-bottom: 20px; font-size: 13px; }
    .preview-btn-group { display: flex; gap: 10px; }
    .btn-edit { flex: 1; padding: 12px; border: 1px solid #ccc; background: #fff; border-radius: 8px; cursor: pointer; }
    .btn-confirm { flex: 1; padding: 12px; border: none; background: var(--burgundy); color: #fff; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* 완료 오버레이 레이어 */
    .result-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(40, 5, 10, 0.35);
      z-index: 6; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      color: #fff; text-align: center; padding: 40px 24px 30px 24px; box-sizing: border-box;
      opacity: 0; pointer-events: none; transition: opacity 0.8s ease-in-out;
    }
    .result-overlay.show { opacity: 1; pointer-events: auto; }
    .result-overlay .date-notice { font-size: 13px; color: #e2d4c0; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.7); margin-bottom: 8px; }
    .btn-share { background-color: #06c755; color: white; border: none; padding: 13px 28px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-top: auto; }

    /* 수신자 전용 카드 디자인 */
    .receive-view {
      padding: 16px 20px;
      text-align: center;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow-y: auto;
    }
    /* 로고 크기 절반 축소(60px) 및 하단 정중앙 배치 */
    .brand-logo-bottom {
      max-width: 60px;
      height: auto;
      margin: 12px auto 0 auto;
      display: block;
    }
    .lock-box { background: #faf7f2; padding: 20px; border-radius: 12px; border: 1px solid #e0d8cc; margin-top: 15px; }
    .store-info { margin-top: 10px; font-size: 11px; color: #666; background: #faf7f2; padding: 10px; border-radius: 6px; border: 1px solid #eee; text-align: left; }
    .maps-btn { display: inline-block; margin-top: 4px; color: var(--burgundy); font-weight: bold; text-decoration: none; }
    
    .from-signature {
      text-align: right;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
      font-size: 15px;
      font-weight: bold;
      color: var(--burgundy);
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="envelope-container" id="envelopeContainer">
    
    <div class="bg-closed"></div>
    <div class="bg-final"></div>
    <div class="bg-opened"></div>

    <!-- 1. 작성용 편지 -->
    <div class="letter" id="senderLetter">
      <div class="form-row">
        <div class="form-col">
          <div class="form-group">
            <span class="to-label">To.</span>
            <input type="text" id="toName" class="input-to" placeholder="お名前">
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <textarea id="message" class="input-msg" maxlength="100" placeholder="12月24日に開くメッセージを入力してください。(100文字以内)" oninput="updateCharCount(this)"></textarea>
            <div class="char-count"><span id="currentCount">0</span> / 100文字</div>
          </div>
          <div class="form-group" style="text-align: right; margin-top: 4px;">
            <span class="to-label" style="font-size: 17px;">From.</span>
            <input type="text" id="fromName" class="input-from" placeholder="差出人のお名前">
          </div>
        </div>

        <div class="form-col" style="display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <div class="form-group">
              <input type="password" id="pin" class="input-pin" maxlength="4" inputmode="numeric" placeholder="暗証番号 (4桁の数字)">
            </div>
            <div class="form-group">
              <select id="giftOption" class="select-gift">
                <option value="free">無料（メッセージのみ贈る）</option>
                <option value="cannele">カヌレ1個 ギフトカード (500円)</option>
                <option value="set">カヌレ＆紅茶セット チケット (1,000円)</option>
              </select>
            </div>
          </div>
          <button class="btn-submit" onclick="openPreview()">メッセージカードを封印して贈る</button>
        </div>
      </div>
    </div>

    <!-- 2. 프리뷰 팝업 -->
    <div class="preview-modal" id="previewModal">
      <div class="preview-content">
        <div style="font-size:16px; font-weight:bold; color:var(--burgundy); margin-bottom:16px;">内容の確認 (最終プレビュー)</div>
        <div class="preview-card">
          <p style="margin:0 0 6px 0;"><strong>To.</strong> <span id="prevTo"></span></p>
          <p style="margin:0 0 10px 0; white-space:pre-wrap; color:#444;" id="prevMsg"></p>
          <p style="margin:0 0 10px 0; text-align:right;"><strong>From.</strong> <span id="prevFrom"></span></p>
          <p style="margin:0; font-size:11px; color:#888; border-top:1px solid #ddd; padding-top:6px;">ギフト: <span id="prevGift"></span></p>
        </div>
        <div class="preview-btn-group">
          <button class="btn-edit" onclick="closePreview()">修正する</button>
          <button class="btn-confirm" onclick="confirmAndSubmit()">この内容で贈る</button>
        </div>
      </div>
    </div>

    <!-- 3. 고급 봉인 완료 오버레이 화면 -->
    <div class="result-overlay" id="resultOverlay">
      <div class="date-notice">12月24日にメッセージが届きます</div>
      <button class="btn-share" onclick="copyShareLink()">LINEで相手に贈る (リンクコピー)</button>
    </div>

    <!-- 4. 받는 사람 전용 수신 화면 -->
    <div class="letter" id="receiverLetter" style="display:none;">
      <div class="receive-view">
        <h3 style="color:var(--burgundy); margin:4px 0 12px 0;">To. <span id="recTo"></span></h3>

        <!-- 암호 입력창 -->
        <div id="lockSection" class="lock-box">
          <p style="font-size:13px; color:#555; margin-bottom:12px;">12月24日開封用 暗証番号を入力してください</p>
          <input type="password" id="recPin" class="input-pin" maxlength="4" placeholder="暗証番号4桁" style="width:60%; margin-bottom:10px;">
          <br>
          <button class="btn-submit" style="width:60%; padding:10px;" onclick="unlockMessage()">開封する</button>
        </div>

        <!-- 메시지 및 기프트 내용 -->
        <div id="contentSection" style="display:none; text-align:left; flex:1; flex-direction:column; justify-content:space-between;">
          <div>
            <!-- 메시지 본문 -->
            <div style="background:#faf7f2; padding:14px 16px; border-radius:8px; border:1px solid #e0d8cc; font-size:13.5px; line-height:1.6; white-space:pre-wrap;" id="recMsg"></div>
            
            <!-- 기프트 선택 시에만 표시 -->
            <div style="margin-top:8px; padding:10px; background:#fff3f4; border-radius:8px; text-align:center; color:var(--burgundy); font-weight:bold; font-size:13px; display:none;" id="recGiftTitle"></div>
          </div>

          <!-- 500엔 / 1000엔 선택 시에만 주소 박스 표시 -->
          <div class="store-info" id="storeInfoBox" style="display:none;">
            ※本チケットは「クラマエ カヌレ 本店（蔵前）」でのみご利用いただけます。<br>
            住所: 東京都台東区蔵前2-1-23 (蔵前駅 徒歩2分)<br>
            <a href="https://maps.google.com/?q=KURAMAE+CANNELE" target="_blank" class="maps-btn">📍 Google Mapsで場所を確認する</a>
          </div>

          <!-- 우측 하단 From. 영역 -->
          <div class="from-signature">From. <span id="recFrom"></span></div>

          <!-- 메시지 상자 및 From. 아래 정중앙 소형 로고(크기 50% 축소) -->
          <img src="logo.png" alt="KURAMAE CANNELÉ" class="brand-logo-bottom" onerror="this.style.display='none'">
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  let generatedShareUrl = '';

  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    
    if (urlParams.has('data')) {
      setupReceiverMode(urlParams.get('data'));
      return;
    }

    setTimeout(() => {
      document.getElementById('envelopeContainer').classList.add('open');
    }, 1500);
  });

  function updateCharCount(textarea) {
    document.getElementById('currentCount').innerText = textarea.value.length;
  }

  function openPreview() {
    const toName = document.getElementById('toName').value;
    const fromName = document.getElementById('fromName').value;
    const msg = document.getElementById('message').value;
    const pin = document.getElementById('pin').value;
    const giftSelect = document.getElementById('giftOption');
    const giftText = giftSelect.options[giftSelect.selectedIndex].text;

    if (!msg) { alert('メッセージを入力してください。'); return; }
    if (!pin || pin.length < 4) { alert('暗証番号4桁を入力してください。'); return; }

    document.getElementById('prevTo').innerText = toName || 'お名前なし';
    document.getElementById('prevFrom').innerText = fromName || 'お名前なし';
    document.getElementById('prevMsg').innerText = msg;
    document.getElementById('prevGift').innerText = giftText;

    document.getElementById('previewModal').classList.add('show');
  }

  function closePreview() {
    document.getElementById('previewModal').classList.remove('show');
  }

  function confirmAndSubmit() {
    closePreview();
    const toName = document.getElementById('toName').value;
    const fromName = document.getElementById('fromName').value;
    const msg = document.getElementById('message').value;
    const pin = document.getElementById('pin').value;
    const gift = document.getElementById('giftOption').value;

    const payload = btoa(encodeURIComponent(JSON.stringify({ t: toName, f: fromName, m: msg, p: pin, g: gift })));
    const baseUrl = window.location.origin + window.location.pathname;
    generatedShareUrl = `${baseUrl}?data=${payload}`;

    const container = document.getElementById('envelopeContainer');
    container.classList.remove('open');
    container.classList.add('sealed');

    setTimeout(() => {
      if (gift === 'cannele') {
        window.location.href = 'https://square.link/u/4U1MkTXp';
        return;
      }
      document.getElementById('resultOverlay').classList.add('show');
    }, 1500);
  }

  function copyShareLink() {
    if (!generatedShareUrl) generatedShareUrl = window.location.href;
    
    navigator.clipboard.writeText(generatedShareUrl).then(() => {
      alert('LINE共有用リンクがコピーされました！\n相手にURLを送信してください。');
    }).catch(() => {
      prompt('以下のURLをコピーして相手に送信してください:', generatedShareUrl);
    });
  }

  function setupReceiverMode(encodedData) {
    try {
      const data = JSON.parse(decodeURIComponent(atob(encodedData)));
      document.getElementById('senderLetter').style.display = 'none';
      const recLetter = document.getElementById('receiverLetter');
      recLetter.style.display = 'block';

      document.getElementById('recTo').innerText = data.t || 'お客様';
      document.getElementById('recFrom').innerText = data.f || '匿名';
      
      const container = document.getElementById('envelopeContainer');
      setTimeout(() => { container.classList.add('open'); }, 1200);

      window.unlockMessage = function() {
        const inputPin = document.getElementById('recPin').value;
        if (inputPin !== data.p) {
          alert('暗証番号が一致しません。');
          return;
        }
        document.getElementById('lockSection').style.display = 'none';
        const contentSec = document.getElementById('contentSection');
        contentSec.style.display = 'flex';
        document.getElementById('recMsg').innerText = data.m;
        
        const giftTitleBox = document.getElementById('recGiftTitle');
        const storeBox = document.getElementById('storeInfoBox');

        if (data.g === 'cannele') {
          giftTitleBox.style.display = 'block';
          giftTitleBox.innerText = '🎁 カヌレ1個 ギフトチケット';
          storeBox.style.display = 'block';
        } else if (data.g === 'set') {
          giftTitleBox.style.display = 'block';
          giftTitleBox.innerText = '🎁 カヌレ＆紅茶セット チケット';
          storeBox.style.display = 'block';
        } else {
          giftTitleBox.style.display = 'none';
          storeBox.style.display = 'none';
        }
      };
    } catch(e) {
      alert('有効なカードデータではありません。');
    }
  }
</script>
</body>
</html>
